<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 th:text="${usuario.id == null ? 'Novo Usuário' : 'Editar Usuário'}"></h1>
        
        <form th:action="@{/view/usuarios/salvar}" th:object="${usuario}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" th:field="*{nome}" required>
            </div>
            
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>
            
            <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" th:field="*{cpf}" required>
            </div>
            
            <div class="mb-3">
                <label for="dtNascimento" class="form-label">Data de Nascimento</label>
                <input type="date" class="form-control" id="dtNascimento" th:field="*{dtNascimento}" 
                       th:value="${usuario.dtNascimento}" required>
            </div>
            
            <div class="mb-3">
                <label for="raca" class="form-label">Raça</label>
                <select class="form-select" id="raca" th:field="*{raca}" required>
                    <option value="">Selecione...</option>
                    <option th:each="racaOp : ${T(br.edu.ifce.meuprimeirospringboot.enums.Raca).values()}"
                            th:value="${racaOp}" 
                            th:text="${racaOp}">
                    </option>
                </select>
            </div>
            
            <!-- Endereço -->
            <fieldset class="mb-3">
                <legend>Endereço</legend>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="logradouro" class="form-label">Logradouro</label>
                        <input type="text" class="form-control" id="logradouro" th:field="*{endereco.logradouro}">
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="numero" class="form-label">Número</label>
                        <input type="text" class="form-control" id="numero" th:field="*{endereco.numero}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="bairro" class="form-label">Bairro</label>
                        <input type="text" class="form-control" id="bairro" th:field="*{endereco.bairro}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="cep" class="form-label">CEP</label>
                        <input type="text" class="form-control" id="cep" th:field="*{endereco.cep}">
                    </div>
                </div>
            </fieldset>

            <!-- Disciplinas -->
            <fieldset class="mb-3">
                <legend>Disciplinas</legend>
                <div id="disciplinasContainer">
                    <div th:each="disciplina, stat : *{disciplinas}" class="disciplina-item border p-3 mb-2">
                        <div class="row">
                            <input type="hidden" th:field="*{disciplinas[__${stat.index}__].id}">
                            <div class="col-md-3 mb-2">
                                <label th:for="'disciplinas' + ${stat.index} + '.nome'" class="form-label">Nome da Disciplina</label>
                                <input type="text" class="form-control" 
                                       th:field="*{disciplinas[__${stat.index}__].nome}">
                            </div>
                            <div class="col-md-3 mb-2">
                                <label th:for="'disciplinas' + ${stat.index} + '.professor'" class="form-label">Professor</label>
                                <input type="text" class="form-control" 
                                       th:field="*{disciplinas[__${stat.index}__].professor}">
                            </div>
                            <div class="col-md-2 mb-2">
                                <label th:for="'disciplinas' + ${stat.index} + '.ano'" class="form-label">Ano</label>
                                <input type="text" class="form-control" 
                                       th:field="*{disciplinas[__${stat.index}__].ano}">
                            </div>
                            <div class="col-md-2 mb-2">
                                <label th:for="'disciplinas' + ${stat.index} + '.periodo'" class="form-label">Período</label>
                                <input type="text" class="form-control" 
                                       th:field="*{disciplinas[__${stat.index}__].periodo}">
                            </div>
                            <div class="col-md-2 d-flex align-items-end mb-2">
                                <button type="button" class="btn btn-danger" onclick="removeDisciplina(this)">Remover</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-success mt-2" onclick="adicionarDisciplina()">Adicionar Disciplina</button>
            </fieldset>
            
            <div class="mb-3">
                <a href="/view/usuarios" class="btn btn-secondary">Voltar</a>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Template para nova disciplina -->
    <template id="disciplinaTemplate">
        <div class="disciplina-item border p-3 mb-2">
            <div class="row">
                <div class="col-md-3 mb-2">
                    <label class="form-label">Nome da Disciplina</label>
                    <input type="text" class="form-control" name="disciplinas[INDEX].nome">
                </div>
                <div class="col-md-3 mb-2">
                    <label class="form-label">Professor</label>
                    <input type="text" class="form-control" name="disciplinas[INDEX].professor">
                </div>
                <div class="col-md-2 mb-2">
                    <label class="form-label">Ano</label>
                    <input type="text" class="form-control" name="disciplinas[INDEX].ano">
                </div>
                <div class="col-md-2 mb-2">
                    <label class="form-label">Período</label>
                    <input type="text" class="form-control" name="disciplinas[INDEX].periodo">
                </div>
                <div class="col-md-2 d-flex align-items-end mb-2">
                    <button type="button" class="btn btn-danger" onclick="removeDisciplina(this)">Remover</button>
                </div>
            </div>
        </div>
    </template>

    <script>
        let disciplinaIndex = document.querySelectorAll('.disciplina-item').length;

        function adicionarDisciplina() {
            const container = document.getElementById('disciplinasContainer');
            const template = document.getElementById('disciplinaTemplate');
            const clone = template.content.cloneNode(true);
            
            // Atualiza os índices dos campos
            clone.querySelectorAll('input').forEach(input => {
                input.name = input.name.replace('INDEX', disciplinaIndex);
            });
            
            container.appendChild(clone);
            disciplinaIndex++;
        }

        function removeDisciplina(button) {
            button.closest('.disciplina-item').remove();
        }
    </script>
</body>
</html>
